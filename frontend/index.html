<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na'vi Translator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d3b2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            color: #00d4ff;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #7eb8c9;
            margin-bottom: 2rem;
        }
        .status {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            display: inline-block;
        }
        .status p { color: #a0c4d0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Na'vi Translator</h1>
        <p class="subtitle">Eywa ngahu — The Great Mother is with you</p>
        <div class="status">
            <p>Application skeleton loaded. Full UI coming in Phase 6.</p>
        </div>
    </div>
</body>
</html>
